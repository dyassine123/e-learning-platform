<div class="flex h-screen overflow-hidden bg-slate-50">
  <app-side-bar-admin></app-side-bar-admin>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative border-l border-slate-200/60">
    <app-nav-bar-admin></app-nav-bar-admin>

    <main class="flex-1 overflow-y-auto relative z-0 focus:outline-none bg-slate-100 flex flex-col">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 flex-1 w-full">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
          <div>
            <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight italic uppercase">Gérer les Catégories</h1>
            <p class="text-slate-500 font-medium italic tracking-tight uppercase text-[10px] tracking-widest mt-1">Créer et organiser les catégories de cours.</p>
          </div>
          <button (click)="openCreate()" 
                  class="btn-primary py-4 px-10 text-[10px] font-black uppercase tracking-widest italic shadow-xl shadow-primary-500/20 transition-all hover:scale-105">
            Nouvelle Catégorie
          </button>
        </header>

        <div *ngIf="message" class="rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-700 px-6 py-4 text-sm font-black italic uppercase tracking-tight shadow-sm mb-8">{{ message }}</div>
        <div *ngIf="error" class="rounded-2xl bg-rose-50 border border-rose-200 text-rose-700 px-6 py-4 text-sm font-black italic uppercase tracking-tight shadow-sm mb-8">{{ error }}</div>

        <!-- Form Overlay -->
        <div *ngIf="showForm" class="bg-white border-2 border-slate-200 rounded-[2.5rem] p-10 shadow-2xl shadow-slate-300/50 italic animate-in fade-in zoom-in duration-300 mb-12">
          <div class="flex justify-between items-center mb-8 pb-4 border-b border-slate-100">
            <h2 class="text-2xl font-black text-slate-900 uppercase italic tracking-tight">{{ editMode ? 'Modifier la Catégorie' : 'Créer une Catégorie' }}</h2>
            <button (click)="showForm = false" class="text-slate-400 hover:text-rose-500 transition-colors">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          </div>

          <form (ngSubmit)="onSubmit()" class="space-y-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">Nom de la Catégorie</label>
                <input type="text" [(ngModel)]="formData.name" name="name" placeholder="ex: Développement Web" 
                       class="w-full px-8 py-5 bg-slate-50 border border-slate-200 rounded-[2rem] text-sm font-black text-slate-900 focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all italic tracking-tight uppercase">
              </div>
              <div>
                <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 italic">Description</label>
                <input type="text" [(ngModel)]="formData.description" name="description" placeholder="Description optionnelle..." 
                       class="w-full px-8 py-5 bg-slate-50 border border-slate-200 rounded-[2rem] text-sm font-black text-slate-900 focus:outline-none focus:ring-4 focus:ring-primary-500/10 focus:border-primary-500 transition-all italic tracking-tight uppercase">
              </div>
            </div>
            <div class="flex justify-end pt-4">
              <button type="submit" class="bg-slate-900 text-white py-5 px-14 rounded-2xl text-[10px] font-black uppercase tracking-widest italic hover:bg-primary-600 transition-all shadow-xl shadow-slate-900/10">
                {{ editMode ? 'Mettre à jour' : 'Créer' }}
              </button>
            </div>
          </form>
        </div>

        <!-- Categories Grid -->
        <div *ngIf="!loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <article *ngFor="let cat of categories" class="bg-white border-2 border-slate-200 rounded-[2rem] p-8 transition-all hover:shadow-2xl hover:border-primary-500/20 group relative overflow-hidden shadow-sm">
            <div class="absolute top-0 right-0 w-24 h-24 bg-primary-500/5 blur-3xl -translate-y-1/2 translate-x-1/2 rounded-full"></div>
            
            <div class="flex justify-between items-start mb-6">
              <div class="w-14 h-14 bg-slate-50 rounded-2xl flex items-center justify-center border border-slate-100 group-hover:bg-primary-50 group-hover:border-primary-100 transition-all">
                <svg class="h-6 w-6 text-slate-400 group-hover:text-primary-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                </svg>
              </div>
              <div class="flex gap-2">
                <button (click)="openEdit(cat)" class="p-3 bg-slate-50 text-slate-400 rounded-xl hover:bg-slate-100 hover:text-primary-600 transition-all border border-slate-100" title="Modifier">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                </button>
                <button (click)="deleteCategory(cat.id)" class="p-3 bg-rose-50 text-rose-400 rounded-xl hover:bg-rose-100 hover:text-rose-600 transition-all border border-rose-100" title="Supprimer">
                  <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
              </div>
            </div>

            <h3 class="text-xl font-black text-slate-900 italic tracking-tight uppercase mb-2 group-hover:text-primary-600 transition-colors">{{ cat.name }}</h3>
            <p class="text-sm text-slate-500 italic line-clamp-2">{{ cat.description || 'Aucune description fournie pour cette catégorie.' }}</p>
          </article>
        </div>

        <div *ngIf="loading" class="flex flex-col items-center justify-center py-20">
          <div class="animate-spin rounded-full h-12 w-12 border-4 border-primary-600 border-t-transparent mb-4"></div>
          <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest italic animate-pulse">Chargement des catégories...</p>
        </div>
      </div>
      <app-footer-admin></app-footer-admin>
    </main>
  </div>
</div>

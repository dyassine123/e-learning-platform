<!-- Admin Layout Wrapper -->
<div class="flex h-screen overflow-hidden bg-slate-50">
  <!-- Sidebar -->
  <app-side-bar-admin></app-side-bar-admin>

  <!-- Main Content Container -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden relative border-l border-slate-200/60">
    <!-- Navbar -->
    <app-nav-bar-admin></app-nav-bar-admin>

    <!-- Scrollable Content -->
    <main class="flex-1 overflow-y-auto relative z-0 focus:outline-none bg-slate-100 flex flex-col">
      <div class="p-8 lg:p-12 flex-1 max-w-7xl mx-auto w-full">
        <!-- Analytics Header Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12" *ngIf="!loading">
          <div
            class="card p-8 bg-white border-2 border-slate-50 shadow-xl shadow-slate-200/40 rounded-[2.5rem] flex items-center gap-6">
            <div
              class="w-16 h-16 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center font-black text-xl italic shadow-sm">
              UT</div>
            <div>
              <div class="text-3xl font-black text-slate-900 italic tracking-tighter">{{ totalUsers | number }}</div>
              <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Utilisateurs Totaux</div>
            </div>
          </div>
          <div
            class="card p-8 bg-white border-2 border-slate-50 shadow-xl shadow-slate-200/40 rounded-[2.5rem] flex items-center gap-6">
            <div
              class="w-16 h-16 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center font-black text-xl italic shadow-sm">
              EN</div>
            <div>
              <div class="text-3xl font-black text-slate-900 italic tracking-tighter">{{ teacherCount | number }}</div>
              <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Enseignants</div>
            </div>
          </div>
          <div
            class="card p-8 bg-white border-2 border-slate-50 shadow-xl shadow-slate-200/40 rounded-[2.5rem] flex items-center gap-6">
            <div
              class="w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center font-black text-xl italic shadow-sm">
              CO</div>
            <div>
              <div class="text-3xl font-black text-slate-900 italic tracking-tighter">{{ courseCount | number }}</div>
              <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Cours Total</div>
            </div>
          </div>
        </div>

        <div *ngIf="loading" class="flex flex-col items-center justify-center py-40">
          <div class="animate-spin rounded-full h-16 w-16 border-4 border-primary-600 border-t-transparent mb-6"></div>
          <p class="text-[10px] font-black uppercase text-slate-400 tracking-widest italic animate-pulse">Chargement des données...</p>
        </div>

        <!-- Multi-Chart Analytics Hub -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12" [class.opacity-0]="loading">
          <!-- Weekly Enrollments (Bar) -->
          <div class="card p-8 border-slate-200/60 bg-white shadow-xl shadow-slate-200/20 rounded-[2.5rem]">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-6">Statut des Cours</h3>
            <div class="h-64">
              <canvas #barChart></canvas>
            </div>
          </div>

          <!-- User Distribution (Doughnut) -->
          <div class="card p-8 border-slate-200/60 bg-white shadow-xl shadow-slate-200/20 rounded-[2.5rem]">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-6">Répartition des Utilisateurs</h3>
            <div class="h-64">
              <canvas #doughnutChart></canvas>
            </div>
          </div>

          <!-- Course Categories (Pie) -->
          <div class="card p-8 border-slate-200/60 bg-white shadow-xl shadow-slate-200/20 rounded-[2.5rem]">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-6">Catégories de Cours</h3>
            <div class="h-64">
              <canvas #pieChart></canvas>
            </div>
          </div>

          <!-- Financial Trend (Line) -->
          <div class="card p-8 border-slate-200/60 bg-white shadow-xl shadow-slate-200/20 rounded-[2.5rem]">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-6">Croissance des Utilisateurs</h3>
            <div class="h-64">
              <canvas #lineChart></canvas>
            </div>
          </div>
        </div>


        <!-- Recent Activity Table -->
      </div>

      <!-- Footer -->
      <app-footer-admin></app-footer-admin>
    </main>
  </div>
</div>

<div class="min-h-screen flex items-center justify-center px-4 py-20 bg-slate-900 overflow-hidden relative">
  <!-- Background Design -->
  <div class="absolute inset-0 z-0">
    <div class="absolute top-0 right-0 w-[800px] h-[800px] bg-primary-600/10 blur-[120px] rounded-full translate-x-1/2 -translate-y-1/2 ring-1 ring-primary-500/20"></div>
    <div class="absolute bottom-0 left-0 w-[600px] h-[600px] bg-indigo-600/10 blur-[100px] rounded-full -translate-x-1/2 translate-y-1/2 ring-1 ring-indigo-500/20"></div>
  </div>

  <div class="max-w-md w-full relative z-10">
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-primary-600 rounded-3xl text-white shadow-2xl shadow-primary-500/30 mb-8 transform -rotate-6 transition-transform hover:rotate-0">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold font-display text-white tracking-tight mb-2 italic">Admin Nexus</h1>
      <p class="text-slate-400 font-medium italic tracking-tight uppercase text-[10px] tracking-widest">Gestion de la plateforme EduFlow</p>
    </div>

    <!-- Login Card -->
    <div class="dark-glass p-10 rounded-[2.5rem] shadow-2xl shadow-black/50 border border-white/5">
      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mb-6 p-4 bg-red-500/10 border border-red-500/20 rounded-2xl text-red-400 text-xs font-bold italic animate-pulse">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="on_submit()" class="space-y-6">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 italic">Email de l'administrateur</label>
          <input type="email" name="email" [(ngModel)]="email" placeholder="admin@eduflow.com" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all italic tracking-tight font-medium">
        </div>

        <div>
          <div class="flex justify-between items-center mb-3">
             <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest italic tracking-widest">Clé secrète / Mot de passe</label>
          </div>
          <input type="password" name="password" [(ngModel)]="password" placeholder="••••••••" class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-2xl text-white text-sm focus:outline-none focus:ring-2 focus:ring-primary-500/30 focus:border-primary-500 transition-all italic tracking-tight font-medium">
        </div>

        <div class="flex items-center justify-between py-2">
           <div class="flex items-center gap-2">
              <input type="checkbox" class="w-4 h-4 bg-white/5 border-white/10 rounded focus:ring-primary-500 cursor-pointer">
              <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest cursor-pointer italic">Maintenir la session</label>
           </div>
           <a href="#" class="text-[10px] font-bold text-primary-500 uppercase tracking-widest hover:text-primary-400 transition-colors italic">Réinitialiser la clé</a>
        </div>

        <button type="submit" [disabled]="loading" class="w-full btn-primary py-4 text-sm font-black uppercase tracking-widest shadow-2xl shadow-primary-500/20 italic disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!loading">Autoriser l'accès</span>
          <span *ngIf="loading" class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Autorisation...
          </span>
        </button>
      </form>
    </div>

    <div class="text-center mt-12">
       <p class="text-[10px] font-bold text-slate-600 uppercase tracking-[0.3em] italic">Accès Interne Uniquement &bull; 2026</p>
    </div>
  </div>
</div>

<nav class="h-20 bg-white border-b border-slate-200 px-6 flex items-center justify-between sticky top-0 z-50 w-full">
  <div class="flex items-center gap-8 text-slate-900">
    <a routerLink="/teacher/dashboard" class="flex items-center gap-2 group">
      <div class="w-9 h-9 bg-indigo-600 rounded-xl flex items-center justify-center text-white">
        <svg class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10.394 2.827a1 1 0 00-.788 0l-7 3a1 1 0 000 1.846l7 3a1 1 0 00.788 0l7-3a1 1 0 000-1.846l-7-3z" />
        </svg>
      </div>
      <span class="text-lg font-bold">EduFlow <span class="text-indigo-600">Enseignant</span></span>
    </a>

    <div class="hidden lg:flex items-center gap-5">
      <a *ngFor="let item of quickLinks" [routerLink]="item.route"
        routerLinkActive="text-indigo-600 border-b-2 border-indigo-600 pb-1"
        class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">
        {{ item.label }}
      </a>
    </div>
  </div>

  <div class="flex items-center gap-4">


    <div class="flex items-center gap-3 pl-4 border-l border-slate-200 group">
      <div class="text-right hidden sm:block">
        <div class="text-xs font-semibold text-slate-900 leading-none mb-1">
          {{ fullName }}
        </div>
        <div class="text-[10px] font-medium text-indigo-600 uppercase leading-none">
          {{ role === 'TEACHER' ? 'ENSEIGNANT' : role }}
        </div>
      </div>
      <div class="w-9 h-9 rounded-xl bg-indigo-100 flex items-center justify-center overflow-hidden">
        <span class="text-indigo-600 font-semibold text-sm">
          {{ fullName.charAt(0).toUpperCase() }}
        </span>
      </div>

      <button (click)="logout()" title="Déconnexion"
        class="ml-1 p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h6a2 2 0 012 2v1" />
        </svg>
      </button>
    </div>
  </div>
</nav>

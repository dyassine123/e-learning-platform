<aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-full z-20 overflow-y-auto">
  <div class="h-20 flex items-center px-6 border-b border-slate-200 sticky top-0 z-10 bg-white">
    <span class="text-sm font-bold text-slate-900">EduFlow <span class="text-primary-600">Étudiant</span></span>
  </div>

  <nav class="flex-1 py-6 px-3 space-y-1">
    <div class="px-3 mb-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Menu Principal</div>
    <a
      *ngFor="let item of mainItems"
      [routerLink]="item.route"
      routerLinkActive="bg-primary-600 text-white"
      [routerLinkActiveOptions]="{ exact: item.route === '/student/dashboard' }"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 hover:text-primary-700 hover:bg-slate-50 transition-colors border border-transparent"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath" />
      </svg>
      {{ item.label }}
    </a>

    <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-rose-600 hover:bg-rose-50 transition-colors mt-6 border border-rose-100">
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
      Déconnexion
    </button>
  </nav>
</aside>

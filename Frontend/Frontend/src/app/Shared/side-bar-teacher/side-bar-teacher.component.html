<aside class="w-64 bg-white border-r border-slate-200 flex flex-col h-full z-20 overflow-y-auto">
  <div class="h-20 flex items-center px-6 border-b border-slate-200 sticky top-0 z-10 bg-white">
    <span class="text-sm font-bold text-slate-900">EduFlow <span class="text-indigo-600">Enseignant</span></span>
  </div>

  <nav class="flex-1 py-6 px-3 space-y-1">
    <div class="px-3 mb-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Menu Principal</div>

    <a
      *ngFor="let item of mainItems"
      [routerLink]="item.route"
      routerLinkActive="bg-indigo-600 text-white"
      [routerLinkActiveOptions]="{ exact: item.route === '/teacher/dashboard' }"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 hover:text-indigo-700 hover:bg-slate-50 transition-colors border border-transparent"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath" />
      </svg>
      {{ item.label }}
    </a>

    <div class="px-3 mt-6 mb-3 text-xs font-semibold text-slate-500 uppercase tracking-wide">Outils</div>

    <a
      *ngFor="let item of toolItems"
      [routerLink]="item.route"
      routerLinkActive="bg-slate-50 border-slate-200 text-indigo-700"
      class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-700 hover:bg-slate-50 hover:border-slate-200 transition-colors border border-transparent"
    >
      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.iconPath" />
      </svg>
      {{ item.label }}
    </a>
  </nav>
</aside>

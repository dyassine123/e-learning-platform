<div class="min-h-screen flex items-center justify-center px-4 py-20 bg-slate-100 transition-all duration-500">
  <div class="max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-10">
      <div
        class="inline-flex items-center justify-center w-16 h-16 bg-primary-600 rounded-2xl text-white shadow-xl shadow-primary-500/30 mb-6 transform rotate-6 hover:rotate-0 transition-transform duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path d="M12 14l9-5-9-5-9 5 9 5z" />
          <path
            d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
        </svg>
      </div>
      <h2
        class="text-3xl font-extrabold font-display text-slate-800 tracking-tight italic uppercase underline decoration-primary-500/30">
        Bon retour parmi nous</h2>
      <p class="mt-3 text-slate-500 font-medium">Veuillez entrer vos informations pour vous connecter.</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100">
      <div *ngIf="errorMessage"
        class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm font-medium">
        {{ errorMessage }}
      </div>
      <form class="space-y-6" (ngSubmit)="on_submit()">
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-2">Adresse Email</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="nom@exemple.com" class="input-field">
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-sm font-semibold text-slate-700">Mot de passe</label>
            <a href="#" class="text-sm font-bold text-primary-600 hover:text-primary-700 transition-colors">Mot de passe oublié ?</a>
          </div>
          <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" class="input-field">
        </div>



        <button type="submit" class="w-full btn-primary py-3.5 text-lg" [disabled]="loading">
          {{ loading ? 'Connexion...' : 'Se connecter' }}
        </button>
      </form>

      <!-- Social Login -->
      <div class="mt-8">
        <div class="relative mb-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-100"></div>
          </div>
          <div
            class="relative flex justify-center text-xs font-bold uppercase tracking-widest text-slate-400 bg-white px-4">
            Ou continuer avec</div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button
            class="flex items-center justify-center py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 transition-all font-semibold text-slate-700 text-sm">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
              <path fill="#EA4335"
                d="M12.48 10.92v3.28h7.84c-.24 1.84-1.92 5.44-7.84 5.44-5.12 0-9.28-4.24-9.28-9.44s4.16-9.44 9.28-9.44c2.92 0 4.88 1.2 6 2.28l2.6-2.6C19.44 1.04 16.28 0 12.48 0 5.56 0 0 5.56 0 12.48s5.56 12.48 12.48 12.48c7.2 0 12-5.08 12-12.24 0-.84-.08-1.48-.24-2.24h-11.76z" />
            </svg>
            Google
          </button>
          <button
            class="flex items-center justify-center py-2.5 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 transition-all font-semibold text-slate-700 text-sm">
            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
            </svg>
            GitHub
          </button>
        </div>
      </div>
    </div>

    <!-- Footer link -->
    <p class="text-center mt-10 text-slate-600 font-medium">
      Vous n'avez pas de compte ?
      <a routerLink="/register" class="text-primary-600 font-bold hover:text-primary-700 transition-colors">Inscrivez-vous gratuitement</a>
    </p>
  </div>
</div>

<div class="min-h-screen flex items-center justify-center px-4 py-20 bg-slate-50">
  <div class="max-w-2xl w-full">
    <!-- Header -->
    <div class="text-center mb-10">
      <h2 class="text-3xl font-extrabold font-display text-slate-900 tracking-tight">Créez votre compte</h2>
      <p class="mt-3 text-slate-500 font-medium">Rejoignez plus de 10 000 étudiants sur EduFlow.</p>
    </div>

    <!-- Register Card -->
    <div class="bg-white p-8 md:p-12 rounded-3xl shadow-xl shadow-slate-200/60 border border-slate-100">

      <form class="grid grid-cols-1 md:grid-cols-2 gap-6" (ngSubmit)="on_submit()">
         <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm font-medium col-span-2">
        {{ errorMessage }}
      </div>
        <!-- First Name -->
        <div class="col-span-1">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Prénom</label>
          <input type="text" placeholder="Jean" class="input-field" [(ngModel)]="firstName" name="firstName">
        </div>
        <!-- Last Name -->
        <div class="col-span-1">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Nom</label>
          <input type="text" placeholder="Dupont" class="input-field" [(ngModel)]="lastName" name="lastName">
        </div>

        <!-- Role Selection -->
        <div class="col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-3">Je souhaite m'inscrire en tant que :</label>
          <div class="grid grid-cols-2 gap-4">
            <label class="relative flex items-center p-4 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-all peer-checked:border-primary-500 peer-checked:ring-1 peer-checked:ring-primary-500">
              <input type="radio" name="role" value="STUDENT" class="w-4 h-4 text-primary-600 border-slate-300 focus:ring-primary-500 cursor-pointer" checked [(ngModel)]="role">
              <span class="ml-3 font-bold text-slate-700">Étudiant</span>
            </label>
            <label class="relative flex items-center p-4 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-all">
              <input type="radio" name="role" value="TEACHER" class="w-4 h-4 text-primary-600 border-slate-300 focus:ring-primary-500 cursor-pointer" [(ngModel)]="role">
              <span class="ml-3 font-bold text-slate-700">Enseignant</span>
            </label>
          </div>
        </div>

        <!-- Email -->
        <div class="col-span-2">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Adresse Email</label>
          <input type="email" placeholder="jean@exemple.com" class="input-field" [(ngModel)]="email" name="email">
        </div>

        <!-- Password -->
        <div class="col-span-1">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Mot de passe</label>
          <input type="password" placeholder="••••••••" class="input-field" [(ngModel)]="password" name="password">
        </div>
        <!-- Confirm Password -->
        <div class="col-span-1">
          <label class="block text-sm font-semibold text-slate-700 mb-2">Confirmer le mot de passe</label>
          <input type="password" placeholder="••••••••" class="input-field" [(ngModel)]="confirmPassword" name="confirmPassword">
        </div>

        <!-- Submit -->
        <div class="col-span-2 mt-4">
          <button type="submit" class="w-full btn-primary py-4 text-lg">Créer le compte</button>
        </div>
      </form>

      <!-- Terms -->
      <p class="mt-8 text-center text-sm text-slate-500 leading-relaxed max-w-sm mx-auto">
        En créant un compte, vous acceptez nos 
        <a href="#" class="font-bold text-slate-700 hover:underline">Conditions d'utilisation</a> et notre 
        <a href="#" class="font-bold text-slate-700 hover:underline">Politique de confidentialité</a>.
      </p>
    </div>

    <!-- Login Link -->
    <p class="text-center mt-10 text-slate-600 font-medium">
      Vous avez déjà un compte ? 
      <a routerLink="/login" class="text-primary-600 font-bold hover:text-primary-700 transition-colors">Connectez-vous</a>
    </p>
  </div>
</div>

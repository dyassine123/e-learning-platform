spring.application.name=elearning-platform

spring.devtools.restart.enabled=false

spring.datasource.url=jdbc:mysql://localhost:3306/elearning_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SERVER PORT
server.port=8081

spring.jpa.open-in-view=false

# JWT TOKEN
security.jwt.secret=6jZ8qR2vL9wP4xN7mB0kS5hA3tC1yG6u
security.jwt.issuer=elearning-platform
security.jwt.ttl-seconds=3600

# Swagger UI Doc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB